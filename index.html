<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WoofCrafts - Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page">
    <div class="paw-bg-decoration"></div>
    <main class="login-container" role="main">
        <div class="login-box">
            <div class="login-logo">🐕</div>
            <h1 class="login-title">WoofCrafts</h1>
            <p class="login-subtitle">🐾 Store staff login to access the POS system</p>
            
            <div id="error-message" class="error-message" role="alert" aria-live="polite"></div>
            
            <form id="login-form" class="login-form" aria-label="Staff login form">
                <div class="login-input-group">
                    <label for="password">🔒 Password</label>
                    <input type="password" id="password" class="login-input" placeholder="Enter password" required autofocus aria-required="true">
                </div>
                <button type="submit" class="login-btn">
                    <span>🚪</span> Enter
                </button>
            </form>
        </div>
    </main>

    <script src="js/config.public.js"></script>
    <!-- Optional: load js/config.js (copy from config-example.js) to override local settings -->
    <script src="js/config.js"></script>
    <script>
        const CORRECT_PASSWORD = (window.POS_CONFIG && window.POS_CONFIG.loginPassword) || 'hyper';
        
        document.getElementById('login-form').addEventListener('submit', (e) => {
            e.preventDefault();
            
            const password = document.getElementById('password').value;
            const errorMessage = document.getElementById('error-message');
            
            if (password === CORRECT_PASSWORD) {
                // Store authentication in sessionStorage
                sessionStorage.setItem('woofcrafts_authenticated', 'true');
                // Redirect to main POS page
                window.location.href = 'pos.html';
            } else {
                errorMessage.textContent = '❌ Incorrect password. Please try again.';
                errorMessage.classList.add('show');
                document.getElementById('password').value = '';
                document.getElementById('password').focus();
                
                // Hide error after 3 seconds
                setTimeout(() => {
                    errorMessage.classList.remove('show');
                }, 3000);
            }
        });
    </script>
</body>
</html>
